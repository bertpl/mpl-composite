# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      # uv reads the PEP 735 `docs` dependency-group (pip cannot), which keeps the docs toolchain
      # out of the package's published PyPI metadata. The project is installed too, so mkdocstrings
      # can import mpl_composite to read its docstrings.
      - pip install uv
      - uv export --no-default-groups --group docs --no-editable --no-hashes > docs-requirements.txt
      - pip install -r docs-requirements.txt

mkdocs:
  configuration: mkdocs.yml
